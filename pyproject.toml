[build-system]
# The project lives in a flat layout with several top-level packages; setuptools
# needs to be told which ones to install (web/ is static and tests/ is plugin data).
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi"
version = "1.0.0"
description = "Xiangqi (Chinese Chess) engine, search bots, match harness, and web app."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
server = ["fastapi", "uvicorn", "httpx"]
web-tests = ["httpx"]
plots = ["matplotlib"]

[tool.setuptools]
packages = ["bots", "engine", "eval", "harness", "server", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `slow` marks tests that take minutes (perft depth 4, 100-game acceptance matches).
# They are deselected by default; run them with `pytest -m slow`.
markers = ["slow: long-running test; run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
